name: Daily quote send

# Sends the morning (7 AM) and evening (9 PM) quotes in America/New_York time.
# GitHub cron is UTC and has no daylight-saving awareness, so we fire at all four
# candidate UTC times. run_scheduled.py only sends when the real Eastern hour is
# 7 or 21, so exactly one send happens per slot in both EST and EDT.

on:
  schedule:
    - cron: '0 11 * * *'   # 7 AM EDT
    - cron: '0 12 * * *'   # 7 AM EST
    - cron: '0 1 * * *'    # 9 PM EDT (previous day, UTC)
    - cron: '0 2 * * *'    # 9 PM EST (previous day, UTC)
  workflow_dispatch:
    inputs:
      slot:
        description: 'Force a slot for a manual test run'
        required: false
        default: 'morning'
        type: choice
        options:
          - morning
          - evening
          - auto

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary python-dotenv resend schedule twilio

      - name: Send quotes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          # Twilio secrets are optional. Email-only if they are not set.
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          # Pass the dispatch input through an env var rather than interpolating
          # it into the run line (safe-pattern for workflow inputs).
          SLOT: ${{ github.event.inputs.slot || 'auto' }}
        run: python run_scheduled.py "$SLOT"
